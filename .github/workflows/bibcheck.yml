name: Bibliography Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  bibcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build Lua interpreter
        run: |
          cd lua-5.5.0
          make linux -j$(nproc)
          echo "Lua $(./src/lua -v 2>&1) built successfully"

      - name: Check .bib files for duplicate keys
        run: |
          shopt -s globstar
          found_dups=false
          for bibfile in **/*.bib; do
            # Skip generated biblatex auxiliary files
            [[ "$bibfile" == *-blx.bib ]] && continue
            dups=$(grep -i "^@" "$bibfile" 2>/dev/null \
              | grep -iv "^@comment\|^@string\|^@preamble" \
              | sed 's/^@[^{(]*[{(]\([^,)]*\).*/\1/' \
              | tr '[:upper:]' '[:lower:]' \
              | sort | uniq -d)
            if [ -n "$dups" ]; then
              echo "⚠️ Doppelte Einträge in $bibfile:"
              echo "$dups"
              found_dups=true
            fi
          done
          if [ "$found_dups" = false ]; then
            echo "✅ Keine doppelten Einträge"
          else
            exit 1
          fi

      - name: Validate required .bib fields (Lua)
        run: |
          # Only run if bib files exist
          bib_files=""
          for f in Ausarbeitung/Ausarbeitung.bib Vortrag/Vortrag.bib; do
            [ -f "$f" ] && bib_files="$bib_files $f"
          done
          if [ -z "$bib_files" ]; then
            echo "ℹ️ No .bib files found, skipping Lua validation"
          else
            lua-5.5.0/src/lua scripts/check-bib.lua $bib_files
          fi

      - name: Cross-reference check (cited keys exist in .bib)
        run: |
          # Collect all defined keys from all .bib files (excluding -blx.bib)
          bib_keys=$(find Ausarbeitung Vortrag -name "*.bib" ! -name "*-blx.bib" \
            -exec grep -ih "^@" {} \; \
            | grep -iv "^@comment\|^@string\|^@preamble" \
            | sed 's/^@[^{(]*[{(]\([^,)]*\).*/\1/' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u)

          if [ -z "$bib_keys" ]; then
            echo "ℹ️ No .bib keys found, skipping cross-reference check"
            exit 0
          fi

          # Collect all \cite{...} variants from all .tex files.
          # Handles optional arguments: \cite[pre][post]{key}, \cite[opt]{key}
          # and multi-key variants \cite{key1,key2}.
          # Matches \cite, \citep, \citet, \textcite, \parencite, \autocite, etc.
          # Uses grep -oP (PCRE) to robustly match all cite command forms.
          cited_raw=$(grep -roP \
              '\\[a-z]*cite[a-z*]*(?:\[[^\]]*\])*\{[^}]+\}' \
              Ausarbeitung/ Vortrag/ 2>/dev/null || true)

          if [ -z "$cited_raw" ]; then
            echo "✅ No \\cite commands found; cross-reference check skipped"
            exit 0
          fi

          cited_keys=$(echo "$cited_raw" \
            | sed 's/.*{\([^}]*\)}/\1/' \
            | tr ',' '\n' \
            | tr -d ' ' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -v '^$' \
            | sort -u)

          missing=false
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            if ! echo "$bib_keys" | grep -qx "$key"; then
              echo "❌ Cited key not found in .bib: $key"
              missing=true
            fi
          done <<< "$cited_keys"

          if [ "$missing" = false ]; then
            echo "✅ All cited keys found in .bib"
          else
            exit 1
          fi
