name: CI Smoke Tests

# Smoke tests that verify the LaTeX templates compile without errors.
# Note: QEMU/cross-compilation is intentionally omitted – these tests
# run natively on the GitHub-hosted ubuntu-latest runner.
#
# Local test commands (requires TeX Live installed):
#   cd Ausarbeitung && latexmk -pdf -interaction=nonstopmode Ausarbeitung.tex
#   cd Vortrag      && latexmk -pdf -interaction=nonstopmode Vortrag.tex
#   # or using the helper script:
#   ./scripts/generatePdf.sh

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  smoke-test-ausarbeitung:
    name: Smoke test – Ausarbeitung
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Ausarbeitung (smoke test)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Ausarbeitung.tex
          working_directory: Ausarbeitung
          args: -pdf -interaction=nonstopmode

      - name: Verify PDF was produced
        run: |
          ls -lh Ausarbeitung/Ausarbeitung.pdf
          echo "Ausarbeitung smoke test passed."

  smoke-test-vortrag:
    name: Smoke test – Vortrag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Vortrag (smoke test)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Vortrag.tex
          working_directory: Vortrag
          args: -pdf -interaction=nonstopmode

      - name: Verify PDF was produced
        run: |
          ls -lh Vortrag/Vortrag.pdf
          echo "Vortrag smoke test passed."
        uses: actions/checkout@v4

      # QEMU is intentionally omitted per maintainer request
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: latex-template:ci

      - name: Create minimal LuaLaTeX test document
        run: |
          mkdir -p test
          cat > test/minimal.tex << 'EOF'
          \documentclass{article}
          \begin{document}
          Minimal LuaLaTeX smoke test.
          \end{document}
          EOF

      - name: Run LuaLaTeX smoke test in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test:/workspace" \
            -w /workspace \
            latex-template:ci \
            bash -c "lualatex --interaction=nonstopmode minimal.tex && lualatex --interaction=nonstopmode minimal.tex"

      - name: Upload minimal.pdf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-pdf
          path: test/minimal.pdf

      - name: Seminar content check
        run: |
          echo "Checking for seminar-specific content in repository files..."
          SEMINAR_PATTERNS=(
            "Angewandte Statistik"
            "Seminar"
          )
          FOUND=0
          FOUND_FILES=""
          for pattern in "${SEMINAR_PATTERNS[@]}"; do
            MATCHES=$(grep -rl "$pattern" \
              --include="*.tex" \
              --include="*.bib" \
              --include="*.md" \
              --exclude-dir=".git" \
              --exclude-dir="legacy" \
              . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              FOUND=1
              FOUND_FILES="$FOUND_FILES\nPattern '$pattern' found in:\n$MATCHES"
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "ERROR: Seminar-specific content detected in repository files:"
            echo -e "$FOUND_FILES"
            exit 1
          else
            echo "OK: No seminar-specific content detected."
          fi

      - name: Script integration test (optional)
        run: |
          if [ -x "scripts/generatePdf.sh" ]; then
            echo "Running scripts/generatePdf.sh integration test..."
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -w /workspace \
              latex-template:ci \
              bash -c "bash scripts/generatePdf.sh" || echo "WARNING: generatePdf.sh integration test failed (non-critical)"
          else
            echo "scripts/generatePdf.sh not found or not executable, skipping integration test."
          fi
